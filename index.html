<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="ControlPanel.png" type="image/webp" />
    <title>Control Panel</title>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-Q8899MK340"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-Q8899MK340");

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap");

      :root {
        --bg-color: #75818f;
        --gold: rgb(202, 172, 94);
        --text-light: #ffffff;
        --card-bg: rgba(0, 0, 0, 0.15);
        --modal-bg: #4a545e;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Tajawal", sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-light);
        padding-top: 130px;
        scroll-behavior: smooth;
      }

      /* شريط التنقل العلوي */
      .nav-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background-color: var(--bg-color);
        box-shadow: 0 2px 8px var(--gold);
        z-index: 1000;
        display: flex;
        align-items: center;
      }

      .nav-wrapper::before,
      .nav-wrapper::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 13px;
        pointer-events: none;
        z-index: 2;
        transition: opacity 0.3s ease;
        opacity: 0;
      }

      .nav-wrapper::before {
        right: 0;
        background: linear-gradient(
          to left,
          rgba(202, 172, 94, 0.8),
          transparent
        );
      }
      .nav-wrapper::after {
        left: 0;
        background: linear-gradient(
          to right,
          rgba(202, 172, 94, 0.8),
          transparent
        );
      }
      .nav-wrapper.show-right-glow::before {
        opacity: 1;
      }
      .nav-wrapper.show-left-glow::after {
        opacity: 1;
      }

      nav {
        display: flex;
        gap: 20px;
        overflow-x: auto;
        white-space: nowrap;
        width: 100%;
        padding: 10px 15px 15px 15px;
        -webkit-overflow-scrolling: touch;
      }

      nav::-webkit-scrollbar {
        display: none;
      }

      .a-nav:first-of-type {
        margin-right: auto;
      }
      .a-nav:last-of-type {
        margin-left: auto;
      }

      .a-nav {
        text-decoration: none;
        color: var(--gold);
        text-align: center;
        position: relative;
        transition: 0.3s;
        cursor: pointer;
      }

      .a-nav h2 {
        font-size: 21px;
        -webkit-text-stroke: 0.2px var(--gold);
        margin-bottom: 5px;
      }

      /* حجم 60 بكسل للأيقونات */
      .a-nav img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        display: block;
        margin: 0 auto;
      }

      /* كلاسات خيارات صور الأقسام */
      .cat-shape-circle {
        border-radius: 50%;
      }
      .cat-shape-original {
        border-radius: 8px;
      }
      .cat-border-gold {
        border: 2px solid var(--gold);
      }
      .cat-border-none {
        border: none;
      }

      .a-nav::after {
        content: "";
        position: absolute;
        bottom: -5px;
        left: 50%;
        transform: translateX(-50%);
        width: 0%;
        height: 3px;
        background-color: var(--gold);
        transition: width 0.3s ease;
      }

      .a-nav:hover::after {
        width: 100%;
      }

      /* زر إضافة قسم */
      .add-category-btn h2 {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        margin-bottom: 0;
      }

      .add-category-btn span.text-add {
        font-size: 18px;
        margin-bottom: 5px;
        -webkit-text-stroke: 0;
      }

      .add-category-btn span.icon-add {
        font-size: 35px;
        line-height: 0.8;
      }

      .header-logo {
        text-align: center;
        margin: 20px 0 40px;
      }
      .header-logo img {
        width: 200px;
      }

      .empty-state-msg {
        text-align: center;
        font-size: 28px;
        color: #dddddd;
        margin-top: 60px;
        padding: 0 20px;
      }

      /* حاوية القسم مع أزرار التحكم */
      .category-section {
        margin-bottom: 40px;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        border-radius: 20px;
      }

      .section-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 40px 0 50px;
      }

      .section-title {
        font-size: 38px;
        color: var(--text-light);
        margin-bottom: 10px;
      }
      .section-title em {
        color: var(--gold);
        font-style: normal;
      }

      .section-controls {
        display: flex;
        gap: 10px;
        direction: rtl;
      }
      .section-controls button {
        background-color: var(--card-bg);
        border: 1px solid var(--gold);
        color: var(--gold);
        border-radius: 5px;
        padding: 5px 10px;
        cursor: pointer;
        font-family: inherit;
        font-size: 14px;
        transition: 0.2s;
      }
      .section-controls button:hover {
        background-color: rgba(202, 172, 94, 0.2);
      }

      /* نظام الكروت */
      .menu-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 10px;
      }

      /* الكرت الثابت */
      .meal-card {
        background-color: var(--card-bg);
        border-radius: 15px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.05);
        flex: 0 0 calc(50% - 10px);
        max-width: 280px;
        position: relative;
        transition: box-shadow 0.3s ease;
      }

      /* كلاس التوهج بعد الحركة */
      .highlight-glow {
        box-shadow: 0 0 20px rgba(202, 172, 94, 0.9) !important;
        z-index: 50;
      }

      /* كلاسات التمييز للاتجاهات */
      .hint-move-right {
        transform: translateX(20px) !important;
        box-shadow: 0 0 15px rgba(202, 172, 94, 0.8) !important;
        z-index: 50;
      }
      .hint-move-left {
        transform: translateX(-20px) !important;
        box-shadow: 0 0 15px rgba(202, 172, 94, 0.8) !important;
        z-index: 50;
      }

      .card-top-controls,
      .card-bottom-controls {
        display: flex;
        justify-content: space-between;
        width: 100%;
      }
      .card-top-controls {
        margin-bottom: 10px;
        padding-bottom: 5px;
        border-bottom: 1px dashed rgba(202, 172, 94, 0.5);
      }
      .card-bottom-controls {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed rgba(202, 172, 94, 0.5);
      }
      .card-top-controls button,
      .card-bottom-controls button {
        background: transparent;
        border: none;
        color: #ddd;
        cursor: pointer;
        font-size: 20px;
        transition: 0.2s;
      }
      .card-top-controls button:hover,
      .card-bottom-controls button:hover {
        color: var(--gold);
        transform: scale(1.1);
      }

      .meal-card img {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border: 2px solid var(--gold);
        border-radius: 10px;
        margin-bottom: 10px;
      }

      .meal-title {
        font-size: 16px;
        text-align: center;
        -webkit-text-stroke: 0.1px white;
        margin-bottom: 8px;
      }

      .meal-price {
        font-size: 19px;
        font-family: Arial, sans-serif;
        color: var(--gold);
        text-align: center;
        font-weight: bold;
        margin-top: auto;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
      }

      details {
        width: 100%;
        text-align: center;
        margin-top: 5px;
        cursor: pointer;
      }

      summary {
        font-size: 16px;
        color: var(--gold);
        outline: none;
        font-weight: bold;
      }

      .meal-details {
        font-size: 14px;
        color: #dddddd;
        margin-top: 8px;
        line-height: 1.4;
      }

      .add-dish-card {
        background-color: transparent;
        border: 2px dashed var(--gold);
        border-radius: 15px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: background-color 0.3s;
        flex: 0 0 calc(50% - 10px);
        max-width: 280px;
        cursor: pointer;
        min-height: 250px;
        color: var(--gold);
      }

      .add-dish-card:hover {
        background-color: rgba(202, 172, 94, 0.1);
      }

      .add-dish-card .plus-icon {
        font-size: 60px;
        font-weight: bold;
        margin-bottom: 10px;
        line-height: 1;
      }

      .add-dish-card .add-text {
        font-size: 22px;
        font-weight: bold;
      }

      /* عداد الصور العائم */
      .image-counter-box {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(5px);
        border: 2px solid var(--gold);
        color: var(--gold);
        padding: 8px 15px;
        border-radius: 25px;
        font-size: 16px;
        font-weight: bold;
        z-index: 1500;
        display: flex;
        align-items: center;
        gap: 8px;
        direction: ltr;
        transition: 0.3s;
      }
      .image-counter-box.limit-reached {
        border-color: #e74c3c;
        color: #e74c3c;
      }

      /* النوافذ المنبثقة */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.8);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 2000;
        padding: 20px;
      }

      .modal-content {
        background-color: var(--modal-bg);
        border: 2px solid var(--gold);
        border-radius: 20px;
        width: 100%;
        max-width: 400px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        text-align: center;
        max-height: 90vh;
        overflow-y: auto;
      }

      .modal-content h3 {
        color: var(--gold);
        margin-bottom: 20px;
        font-size: 26px;
      }

      .input-group {
        margin-bottom: 15px;
        text-align: right;
      }

      .input-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      .input-group input[type="text"],
      .input-group input[type="number"],
      .input-group textarea {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        background-color: rgba(255, 255, 255, 0.9);
        font-family: inherit;
        font-size: 16px;
        direction: rtl;
      }

      .input-group textarea {
        resize: vertical;
        min-height: 80px;
      }

      .hidden-file-input {
        display: none;
      }

      .custom-file-label {
        display: inline-block;
        padding: 12px 15px;
        background-color: var(--card-bg);
        border: 2px dashed var(--gold);
        color: var(--gold);
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
        font-size: 16px;
        width: 100%;
        text-align: center;
      }

      .custom-file-label:hover {
        background-color: rgba(202, 172, 94, 0.1);
      }

      /* تنسيق اسم الملف الطويل */
      .file-name-display {
        display: block;
        margin-top: 8px;
        font-size: 13px;
        color: #ccc;
        text-align: center;
        direction: ltr; /* يساعد في الحفاظ على الصيغة في النهاية .png */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }

      /* معاينة الصورة بالنص */
      #catImagePreview {
        width: 60px;
        height: 60px;
        object-fit: cover;
        margin: 10px auto 0;
        display: none;
        transition:
          border-radius 0.3s,
          border 0.3s; /* انتقال ناعم لما تغير الشكل */
      }

      #dishImagePreview {
        width: 120px;
        height: 90px;
        border-radius: 10px;
        object-fit: cover;
        margin: 10px auto 0;
        display: none;
        border: 2px solid var(--gold);
      }

      /* حاوية الخيارات المخفية (الشكل والحدود) */
      #catImageOptionsWrapper {
        display: none; /* مخفي افتراضيا */
        flex-direction: column;
        gap: 8px;
        align-items: center;
        margin: 15px auto 0;
        width: max-content;
      }

      .radio-group-options {
        display: flex;
        gap: 15px;
        justify-content: center;
        background-color: rgba(255, 255, 255, 0.1);
        padding: 8px 15px;
        border-radius: 8px;
        border: 1px dashed var(--gold);
      }

      .radio-group-options label {
        margin-bottom: 0;
        font-weight: normal;
        cursor: pointer;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .modal-btns {
        display: flex;
        gap: 15px;
        margin-top: 25px;
      }

      .modal-btns button {
        flex: 1;
        padding: 12px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        border: none;
        font-family: inherit;
        transition: 0.2s;
      }

      .btn-save {
        background-color: var(--gold);
        color: #111;
      }
      .btn-save:hover {
        background-color: #dcc482;
      }
      .btn-cancel {
        background-color: #ccc;
        color: #333;
      }
      .btn-cancel:hover {
        background-color: #bbb;
      }
      .btn-danger {
        background-color: #e74c3c !important;
        color: white !important;
      }
      .btn-danger:hover {
        background-color: #c0392b !important;
      }

      @media (min-width: 570px) {
        .menu-grid {
          gap: 25px;
          padding: 0 20px;
        }
        .add-dish-card,
        .meal-card {
          flex: 0 0 calc(33.333% - 20px);
          border-radius: 20px;
          min-height: 320px;
        }
        .meal-title {
          font-size: 24px;
        }
        .meal-price {
          font-size: 24px;
        }
        summary {
          font-size: 20px;
        }
        .meal-details {
          font-size: 16px;
        }
      }

      @media (min-width: 1024px) {
        .add-dish-card,
        .meal-card {
          flex: 0 0 calc(25% - 20px);
        }
      }
    </style>
  </head>
  <body>
    <!-- عداد الصور العائم -->
    <div id="imageCounterBox" class="image-counter-box">
      <span id="imageCounterText">0 / 100</span> صورة
    </div>

    <div class="nav-wrapper" id="navWrapper">
      <nav id="mainNav">
        <a
          class="a-nav add-category-btn"
          id="addCategoryBtn"
          onclick="openCategoryModal()"
        >
          <h2>
            <span class="text-add">إضافة قسم</span>
            <span class="icon-add">+</span>
          </h2>
        </a>
      </nav>
    </div>

    <div class="header-logo">
      <img src="Logo638639112983938688.webp" alt="Logo" />
    </div>

    <div id="appContainer">
      <div class="empty-state-msg" id="emptyMessage">
        يرجى إضافة قسم جديد للبدء ببناء المنيو
      </div>
    </div>

    <!-- ================= شاشات النوافذ المنبثقة ================= -->

    <!-- شاشة القسم -->
    <div class="modal-overlay" id="categoryModal">
      <div class="modal-content">
        <h3 id="catModalTitle">إضافة قسم جديد</h3>
        <div class="input-group">
          <label>اسم القسم:</label>
          <input
            type="text"
            id="catNameInput"
            placeholder="مثال: وجبات، مشروبات..."
          />
        </div>

        <div class="input-group">
          <label>صورة القسم:</label>
          <input
            type="file"
            id="catImageInput"
            class="hidden-file-input"
            accept="image/*"
          />
          <label for="catImageInput" class="custom-file-label"
            >اختر صورة القسم</label
          >
          <span id="catFileName" class="file-name-display"
            >لم يتم اختيار أي ملف</span
          >

          <img
            id="catImagePreview"
            src=""
            alt="معاينة"
            class="cat-shape-circle cat-border-gold"
          />

          <!-- خيارات شكل الصورة (تظهر فقط عند وجود صورة) -->
          <div id="catImageOptionsWrapper">
            <div class="radio-group-options">
              <label
                ><input type="radio" name="catShape" value="circle" checked />
                دائري</label
              >
              <label
                ><input type="radio" name="catShape" value="original" />
                مربع</label
              >
            </div>
            <div class="radio-group-options">
              <label
                ><input type="radio" name="catBorder" value="gold" checked /> مع
                حدود</label
              >
              <label
                ><input type="radio" name="catBorder" value="none" /> بدون
                حدود</label
              >
            </div>
          </div>
        </div>

        <div class="modal-btns">
          <button class="btn-save" onclick="saveCategory()">حفظ</button>
          <button class="btn-cancel" onclick="closeCategoryModal()">
            إلغاء
          </button>
        </div>
      </div>
    </div>

    <!-- شاشة الطبق -->
    <div class="modal-overlay" id="dishModal">
      <div class="modal-content">
        <h3 id="dishModalTitle">إضافة طبق جديد</h3>
        <div class="input-group">
          <label>اسم الطبق:</label>
          <input
            type="text"
            id="dishNameInput"
            placeholder="مثال: وجبة برجر لحم"
          />
        </div>
        <div class="input-group">
          <label>السعر (KWD):</label>
          <input
            type="number"
            step="0.050"
            id="dishPriceInput"
            placeholder="مثال: 2.250"
          />
        </div>
        <div class="input-group">
          <label>التفاصيل (اختياري):</label>
          <textarea
            id="dishDetailsInput"
            placeholder="اكتب تفاصيل ومكونات الطبق هنا..."
          ></textarea>
        </div>
        <div class="input-group">
          <label>صورة الطبق:</label>
          <input
            type="file"
            id="dishImageInput"
            class="hidden-file-input"
            accept="image/*"
          />
          <label for="dishImageInput" class="custom-file-label"
            >اختر صورة الطبق</label
          >
          <span id="dishFileName" class="file-name-display"
            >لم يتم اختيار أي ملف</span
          >
          <img id="dishImagePreview" src="" alt="معاينة" />
        </div>
        <div class="modal-btns">
          <button class="btn-save" onclick="saveDish()">حفظ</button>
          <button class="btn-cancel" onclick="closeDishModal()">إلغاء</button>
        </div>
      </div>
    </div>

    <!-- شاشة الحذف المخصصة -->
    <div class="modal-overlay" id="deleteModal">
      <div class="modal-content" style="max-width: 350px">
        <h3 style="color: #e74c3c">تأكيد الحذف</h3>
        <p
          id="deleteModalMsg"
          style="font-size: 18px; margin-bottom: 25px; line-height: 1.5"
        ></p>
        <div class="modal-btns">
          <button class="btn-save btn-danger" onclick="confirmDelete()">
            حذف
          </button>
          <button class="btn-cancel" onclick="closeDeleteModal()">إلغاء</button>
        </div>
      </div>
    </div>

    <script>
      let currentCatImageBase64 = "";
      let currentDishImageBase64 = "";
      const MAX_TOTAL_IMAGES = 100;
      let isMoving = false;

      function updateImageCounter() {
        const totalImages = document.querySelectorAll(
          "#mainNav .a-nav:not(.add-category-btn) img, .meal-card img",
        ).length;
        const counterBox = document.getElementById("imageCounterBox");
        const counterText = document.getElementById("imageCounterText");

        counterText.textContent = `${totalImages} / 100`;
        if (totalImages >= MAX_TOTAL_IMAGES) {
          counterBox.classList.add("limit-reached");
        } else {
          counterBox.classList.remove("limit-reached");
        }
        return totalImages;
      }

      function compressImage(file, callback) {
        if (file.size <= 600 * 1024) {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = function (event) {
            callback(event.target.result);
          };
          return;
        }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function (event) {
          const img = new Image();
          img.src = event.target.result;
          img.onload = function () {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            let width = img.width;
            let height = img.height;
            const MAX_WIDTH = 1080;
            if (width > MAX_WIDTH) {
              height = Math.round(height * (MAX_WIDTH / width));
              width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            const compressedDataUrl = canvas.toDataURL("image/webp", 0.85);
            callback(compressedDataUrl);
          };
        };
      }

      // تحديث المعاينة الحية للأقسام
      function updateCatPreviewClasses() {
        const shape = document.querySelector(
          'input[name="catShape"]:checked',
        ).value;
        const border = document.querySelector(
          'input[name="catBorder"]:checked',
        ).value;
        const preview = document.getElementById("catImagePreview");

        preview.className = "image-preview-container";
        preview.classList.add(
          shape === "circle" ? "cat-shape-circle" : "cat-shape-original",
        );
        preview.classList.add(
          border === "gold" ? "cat-border-gold" : "cat-border-none",
        );
      }

      document
        .querySelectorAll('input[name="catShape"], input[name="catBorder"]')
        .forEach((radio) => {
          radio.addEventListener("change", updateCatPreviewClasses);
        });

      function formatFileName(name) {
        if (!name) return "لم يتم اختيار أي ملف";
        return name.length > 30 ? name.substring(0, 27) + "..." : name;
      }

      document
        .getElementById("catImageInput")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          document.getElementById("catFileName").textContent = formatFileName(
            file ? file.name : null,
          );
          const preview = document.getElementById("catImagePreview");
          const optionsWrapper = document.getElementById(
            "catImageOptionsWrapper",
          );

          if (file) {
            compressImage(file, function (dataUrl) {
              currentCatImageBase64 = dataUrl;
              preview.src = dataUrl;
              preview.style.display = "block";
              optionsWrapper.style.display = "flex";
              updateCatPreviewClasses();
            });
          } else {
            currentCatImageBase64 = "";
            if (!editTargetCategory) {
              preview.style.display = "none";
              optionsWrapper.style.display = "none";
            }
          }
        });

      document
        .getElementById("dishImageInput")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          document.getElementById("dishFileName").textContent = formatFileName(
            file ? file.name : null,
          );
          const preview = document.getElementById("dishImagePreview");

          if (file) {
            compressImage(file, function (dataUrl) {
              currentDishImageBase64 = dataUrl;
              preview.src = dataUrl;
              preview.style.display = "block";
            });
          } else {
            currentDishImageBase64 = "";
            preview.style.display = "none";
          }
        });

      let categoryCount = 0;
      let currentActiveGridId = "";
      let editTargetCategory = null;
      let editTargetDish = null;
      let itemToDelete = null;

      // ================= دوال التحكم في الأقسام =================
      function openCategoryModal(catId = null) {
        document.getElementById("categoryModal").style.display = "flex";
        editTargetCategory = catId ? document.getElementById(catId) : null;
        const preview = document.getElementById("catImagePreview");
        const optionsWrapper = document.getElementById(
          "catImageOptionsWrapper",
        );

        if (editTargetCategory) {
          document.getElementById("catModalTitle").textContent = "تعديل القسم";
          const titleElem =
            editTargetCategory.querySelector(".section-title em");
          document.getElementById("catNameInput").value = titleElem.textContent
            .replace(/~/g, "")
            .trim();
          document.getElementById("catFileName").textContent =
            "اختر صورة جديدة";

          const navLink = document.querySelector(
            `.a-nav[href="#${editTargetCategory.id}"]`,
          );
          const navImg = navLink.querySelector("img");

          // استرجاع الخيارات القديمة
          document.querySelector(
            `input[name="catShape"][value="${navImg.classList.contains("cat-shape-original") ? "original" : "circle"}"]`,
          ).checked = true;
          document.querySelector(
            `input[name="catBorder"][value="${navImg.classList.contains("cat-border-none") ? "none" : "gold"}"]`,
          ).checked = true;

          preview.src = navImg.src;
          preview.style.display = "block";
          optionsWrapper.style.display = "flex";
          updateCatPreviewClasses();

          currentCatImageBase64 = "";
        } else {
          document.getElementById("catModalTitle").textContent =
            "إضافة قسم جديد";
          document.getElementById("catNameInput").value = "";
          document.getElementById("catImageInput").value = "";
          document.getElementById("catFileName").textContent =
            "لم يتم اختيار أي ملف";

          document.querySelector(
            'input[name="catShape"][value="circle"]',
          ).checked = true;
          document.querySelector(
            'input[name="catBorder"][value="gold"]',
          ).checked = true;

          preview.src = "";
          preview.style.display = "none";
          optionsWrapper.style.display = "none";
          updateCatPreviewClasses();

          currentCatImageBase64 = "";
        }
      }

      function closeCategoryModal() {
        document.getElementById("categoryModal").style.display = "none";
      }

      function saveCategory() {
        const name = document.getElementById("catNameInput").value;
        const shape = document.querySelector(
          'input[name="catShape"]:checked',
        ).value;
        const border = document.querySelector(
          'input[name="catBorder"]:checked',
        ).value;

        if (!name) {
          alert("يرجى كتابة اسم القسم");
          return;
        }
        if (!editTargetCategory && !currentCatImageBase64) {
          alert("يرجى اختيار صورة للقسم الجديد");
          return;
        }

        if (!editTargetCategory && updateImageCounter() >= MAX_TOTAL_IMAGES) {
          alert("عذراً، لقد وصلت للحد الأقصى من الصور المسموحة (100 صورة).");
          return;
        }

        const shapeClass =
          shape === "circle" ? "cat-shape-circle" : "cat-shape-original";
        const borderClass =
          border === "gold" ? "cat-border-gold" : "cat-border-none";
        const imgClasses = `${shapeClass} ${borderClass}`;

        document.getElementById("emptyMessage").style.display = "none";

        if (editTargetCategory) {
          editTargetCategory.querySelector(".section-title em").textContent =
            `~ ${name} ~`;
          const navLink = document.querySelector(
            `.a-nav[href="#${editTargetCategory.id}"]`,
          );
          const imgElem = navLink.querySelector("img");

          if (currentCatImageBase64) {
            imgElem.src = currentCatImageBase64;
          }
          imgElem.className = imgClasses;

          const imgHTML = imgElem.outerHTML;
          navLink.querySelector("h2").innerHTML =
            `<span style="font-size: 21px; margin-bottom: 5px; display:block;">${name}</span>${imgHTML}`;
        } else {
          categoryCount++;
          const sectionId = "category-" + categoryCount;

          const mainNav = document.getElementById("mainNav");
          const newNavBtn = document.createElement("a");
          newNavBtn.className = "a-nav";
          newNavBtn.href = "#" + sectionId;
          newNavBtn.innerHTML = `<h2><span style="font-size: 21px; margin-bottom: 5px; display:block;">${name}</span><img src="${currentCatImageBase64}" class="${imgClasses}" alt="${name}"></h2>`;
          mainNav.insertBefore(
            newNavBtn,
            document.getElementById("addCategoryBtn"),
          );

          const appContainer = document.getElementById("appContainer");
          const sectionWrapper = document.createElement("div");
          sectionWrapper.className = "category-section";
          sectionWrapper.id = sectionId;

          sectionWrapper.innerHTML = `
                    <div class="section-header">
                        <h1 class="section-title"><em>~ ${name} ~</em></h1>
                        <div class="section-controls">
                            <button onclick="moveCategory('${sectionId}', -1)">🔼 رفع</button>
                            <button onclick="openCategoryModal('${sectionId}')">✏️ تعديل</button>
                            <button onclick="openDeleteCategory('${sectionId}', '${name}')">🗑️ حذف</button>
                            <button onclick="moveCategory('${sectionId}', 1)">🔽 خفض</button>
                        </div>
                    </div>
                    <div class="menu-grid" id="grid-${sectionId}">
                        <div class="add-dish-card" onclick="openDishModal('grid-${sectionId}')">
                            <div class="plus-icon">+</div>
                            <div class="add-text">إضافة طبق</div>
                        </div>
                    </div>
                `;
          appContainer.appendChild(sectionWrapper);
        }
        closeCategoryModal();
        updateNavGlow();
        updateImageCounter();
      }

      function moveCategory(catId, direction) {
        if (isMoving) return;
        isMoving = true;

        const section = document.getElementById(catId);
        const appContainer = document.getElementById("appContainer");
        const navLink = document.querySelector(`.a-nav[href="#${catId}"]`);
        const mainNav = document.getElementById("mainNav");

        // انتقال فوري
        if (direction === -1) {
          const prevSection = section.previousElementSibling;
          if (
            prevSection &&
            prevSection.classList.contains("category-section")
          ) {
            appContainer.insertBefore(section, prevSection);
            const prevNav = navLink.previousElementSibling;
            if (prevNav) mainNav.insertBefore(navLink, prevNav);
          }
        } else {
          const nextSection = section.nextElementSibling;
          if (
            nextSection &&
            nextSection.classList.contains("category-section")
          ) {
            appContainer.insertBefore(nextSection, section);
            const nextNav = navLink.nextElementSibling;
            if (nextNav && !nextNav.classList.contains("add-category-btn")) {
              mainNav.insertBefore(nextNav, navLink);
            }
          }
        }

        // تطبيق توهج النقل
        section.classList.add("highlight-glow");
        setTimeout(() => {
          section.classList.remove("highlight-glow");
          isMoving = false;
        }, 300);
      }

      // ================= دوال التحكم في الأطباق =================
      function openDishModal(gridId, cardElem = null) {
        currentActiveGridId = gridId;
        editTargetDish = cardElem;
        const preview = document.getElementById("dishImagePreview");

        if (editTargetDish) {
          document.getElementById("dishModalTitle").textContent = "تعديل الطبق";
          document.getElementById("dishNameInput").value =
            editTargetDish.querySelector(".meal-title").textContent;
          document.getElementById("dishPriceInput").value = parseFloat(
            editTargetDish.querySelector(".meal-price span").textContent,
          );

          const detailsElem = editTargetDish.querySelector(".meal-details");
          document.getElementById("dishDetailsInput").value = detailsElem
            ? detailsElem.textContent
            : "";
          document.getElementById("dishFileName").textContent =
            "اختر صورة جديدة";

          preview.src = editTargetDish.querySelector("img").src;
          preview.style.display = "block";
          currentDishImageBase64 = "";
        } else {
          document.getElementById("dishModalTitle").textContent =
            "إضافة طبق جديد";
          document.getElementById("dishNameInput").value = "";
          document.getElementById("dishPriceInput").value = "";
          document.getElementById("dishDetailsInput").value = "";
          document.getElementById("dishImageInput").value = "";
          document.getElementById("dishFileName").textContent =
            "لم يتم اختيار أي ملف";
          preview.src = "";
          preview.style.display = "none";
          currentDishImageBase64 = "";
        }
        document.getElementById("dishModal").style.display = "flex";
      }

      function closeDishModal() {
        document.getElementById("dishModal").style.display = "none";
      }

      function saveDish() {
        const name = document.getElementById("dishNameInput").value;
        const price = parseFloat(
          document.getElementById("dishPriceInput").value,
        ).toFixed(3);
        const details = document.getElementById("dishDetailsInput").value;

        if (!name || !price || isNaN(price)) {
          alert("يرجى تعبئة الاسم والسعر");
          return;
        }
        if (!editTargetDish && !currentDishImageBase64) {
          alert("يرجى اختيار صورة للطبق الجديد");
          return;
        }

        if (!editTargetDish && updateImageCounter() >= MAX_TOTAL_IMAGES) {
          alert("عذراً، لقد وصلت للحد الأقصى من الصور المسموحة (100 صورة).");
          return;
        }

        let imageUrl = currentDishImageBase64;
        if (!imageUrl && editTargetDish) {
          imageUrl = editTargetDish.querySelector("img").src;
        }

        let detailsHTML = "";
        if (details.trim() !== "") {
          detailsHTML = `
                    <details>
                        <summary>التفاصيل</summary>
                        <div class="meal-details">${details}</div>
                    </details>
                `;
        }

        const innerHTMLContent = `
                <div class="card-top-controls">
                    <button onclick="openDeleteDish(this)" title="حذف">🗑️</button>
                    <button onclick="openDishModal('${currentActiveGridId}', this.closest('.meal-card'))" title="تعديل">✏️</button>
                </div>
                <img src="${imageUrl}" alt="${name}">
                <h3 class="meal-title">${name}</h3>
                ${detailsHTML}
                <div class="meal-price"><span dir="ltr">${price} KWD</span></div>
                <div class="card-bottom-controls">
                    <button class="btn-right-arrow" onclick="moveDish(this, -1)" title="يمين">▶️</button>
                    <button class="btn-left-arrow" onclick="moveDish(this, 1)" title="يسار">◀️</button>
                </div>
            `;

        if (editTargetDish) {
          editTargetDish.innerHTML = innerHTMLContent;
        } else {
          const dishCard = document.createElement("div");
          dishCard.className = "meal-card";
          dishCard.innerHTML = innerHTMLContent;

          const gridContainer = document.getElementById(currentActiveGridId);
          const addDishBtn = gridContainer.querySelector(".add-dish-card");
          gridContainer.insertBefore(dishCard, addDishBtn);
        }

        closeDishModal();
        refreshArrows();
        updateImageCounter();
      }

      function moveDish(btnElem, direction) {
        if (isMoving) return;
        isMoving = true;

        const card = btnElem.closest(".meal-card");
        const grid = card.parentElement;

        // انتقال فوري للمكان الجديد
        if (direction === -1) {
          const prevCard = card.previousElementSibling;
          if (prevCard) {
            grid.insertBefore(card, prevCard);
          }
        } else {
          const nextCard = card.nextElementSibling;
          if (nextCard && !nextCard.classList.contains("add-dish-card")) {
            grid.insertBefore(nextCard, card);
          }
        }

        // تشغيل توهج النقل
        card.classList.add("highlight-glow");
        refreshArrows();

        setTimeout(() => {
          card.classList.remove("highlight-glow");
          isMoving = false;
        }, 300);
      }

      // ================= دوال الحذف المخصصة =================
      function openDeleteCategory(catId, name) {
        itemToDelete = { type: "category", id: catId };
        document.getElementById("deleteModalMsg").textContent =
          `هل أنت متأكد من حذف قسم (${name}) بجميع أطباقه؟`;
        document.getElementById("deleteModal").style.display = "flex";
      }

      function openDeleteDish(btnElem) {
        const card = btnElem.closest(".meal-card");
        const name = card.querySelector(".meal-title").textContent;
        itemToDelete = { type: "dish", element: card };
        document.getElementById("deleteModalMsg").textContent =
          `هل أنت متأكد من حذف طبق (${name})؟`;
        document.getElementById("deleteModal").style.display = "flex";
      }

      function closeDeleteModal() {
        document.getElementById("deleteModal").style.display = "none";
        itemToDelete = null;
      }

      function confirmDelete() {
        if (itemToDelete.type === "category") {
          document.getElementById(itemToDelete.id).remove();
          const navLink = document.querySelector(
            `.a-nav[href="#${itemToDelete.id}"]`,
          );
          if (navLink) navLink.remove();

          if (document.querySelectorAll(".category-section").length === 0) {
            document.getElementById("emptyMessage").style.display = "block";
          }
          updateNavGlow();
        } else if (itemToDelete.type === "dish") {
          itemToDelete.element.remove();
          refreshArrows();
        }
        closeDeleteModal();
        updateImageCounter();
      }

      // ================= تحديث الأسهم (الأسهم الذكية) =================
      function refreshArrows() {
        document.querySelectorAll(".menu-grid").forEach((grid) => {
          const cards = Array.from(grid.querySelectorAll(".meal-card"));
          cards.forEach((card, index) => {
            const btnRight = card.querySelector(".btn-right-arrow");
            const btnLeft = card.querySelector(".btn-left-arrow");
            if (!btnRight || !btnLeft) return;

            btnRight.style.visibility = "visible";
            btnLeft.style.visibility = "visible";

            btnRight.title = "يمين";
            btnRight.textContent = "▶️";
            btnLeft.title = "يسار";
            btnLeft.textContent = "◀️";

            const isFirstInRow =
              index === 0 || card.offsetTop > cards[index - 1].offsetTop;
            if (isFirstInRow) {
              btnRight.title = "أعلى";
              btnRight.textContent = "🔼";
            }

            const isLastInRow =
              index === cards.length - 1 ||
              cards[index + 1].offsetTop > card.offsetTop;
            if (isLastInRow) {
              btnLeft.title = "أسفل";
              btnLeft.textContent = "🔽";
            }
          });
        });
      }

      // --- التوهج الذهبي ---
      const nav = document.getElementById("mainNav");
      const navWrapper = document.getElementById("navWrapper");

      function updateNavGlow() {
        const maxScroll = nav.scrollWidth - nav.clientWidth;
        if (maxScroll <= 0) {
          navWrapper.classList.remove("show-right-glow", "show-left-glow");
          return;
        }
        const navRect = nav.getBoundingClientRect();
        const firstItem = nav.firstElementChild;
        const lastItem = nav.lastElementChild;
        const canScrollRight =
          firstItem.getBoundingClientRect().right > navRect.right + 5;
        const canScrollLeft =
          lastItem.getBoundingClientRect().left < navRect.left - 5;
        if (canScrollRight) navWrapper.classList.add("show-right-glow");
        else navWrapper.classList.remove("show-right-glow");
        if (canScrollLeft) navWrapper.classList.add("show-left-glow");
        else navWrapper.classList.remove("show-left-glow");
      }

      nav.addEventListener("scroll", updateNavGlow);
      window.addEventListener("resize", () => {
        updateNavGlow();
        refreshArrows();
      });
      updateNavGlow();

      // تشغيل العداد أول مرة
      updateImageCounter();
    </script>
  </body>
</html>
